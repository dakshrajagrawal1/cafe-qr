services:
  - type: web
    name: cafe-qr-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install && pnpm --filter @cafe-qr/shared build && cd server && npx prisma generate && pnpm build
    startCommand: cd server && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: OTP_PROVIDER
        value: console
      - key: DATABASE_URL
        sync: false # Set to your free TiDB connection string
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TABLE_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: SUPER_ADMIN_EMAIL
        value: admin@cafeqr.com
      - key: SUPER_ADMIN_PASSWORD
        value: Admin@12345
